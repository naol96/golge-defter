<!doctype html>
<html lang="tr" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Yapay zekâ kararlarını deterministik yatırım kurallarıyla denetleyen PAPER kontrol masası." />
    <meta name="color-scheme" content="light dark" />
    <title>shadow ledger — Kokpit</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231c2925'/%3E%3Crect x='11' y='9' width='16' height='20' rx='3.5' fill='%23c5edaa' opacity='.3'/%3E%3Crect x='5' y='3' width='16' height='20' rx='3.5' fill='%231c2925' stroke='%23c5edaa' stroke-width='1.9'/%3E%3Cpath d='M9.5 9h7M9.5 13h5' stroke='%23c5edaa' stroke-width='1.9' stroke-linecap='round'/%3E%3Cpath d='M9.5 17h7' stroke='%23c5edaa' stroke-width='1.9' stroke-linecap='round' stroke-dasharray='1.6 2.6' opacity='.6'/%3E%3C/svg%3E" />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem("golge-theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
        else if (t === "system") delete document.documentElement.dataset.theme;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>shadow ledger kokpiti JavaScript gerektirir.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
