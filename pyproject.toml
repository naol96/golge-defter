[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "golge-defter"
version = "0.1.0"
description = "Deterministic risk constitution for a shadow-ledger agent prototype (paper-only)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-xdist>=3"]
dashboard = ["streamlit>=1.28"]

[tool.setuptools.packages.find]
where = [".", "src"]
include = ["contracts*", "core*", "adapters*", "storage*", "dashboard*", "golge_defter*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
